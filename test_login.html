<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #1B4332; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2D6A4F; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login Test</h2>
        <input type="text" id="username" placeholder="Username" value="clinician">
        <input type="password" id="password" placeholder="Password" value="clinician123">
        <button onclick="testLogin()">Test Login</button>
        <div id="result"></div>
    </div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                console.log('Attempting login to http://localhost:8000/api/auth/login');
                console.log('Username:', username);
                
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ LOGIN SUCCESS!</strong><br>
                        User: ${data.user.full_name}<br>
                        Role: ${data.user.role}<br>
                        Token: ${data.access_token.substring(0, 50)}...
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ LOGIN FAILED</strong><br>
                        ${data.detail || 'Unknown error'}
                    `;
                }
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ ERROR</strong><br>
                    ${error.message}<br><br>
                    <strong>Possible issues:</strong><br>
                    - Backend not running (check http://localhost:8000/docs)<br>
                    - CORS issue<br>
                    - Network error
                `;
            }
        }
    </script>
</body>
</html>
